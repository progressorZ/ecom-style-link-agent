title: "[分享] "
labels: ["show and tell"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: 分享类型
      options:
        - 新 Adapter 或 App
        - 使用案例
        - 测试与兼容经验
        - 导入器或周边工具
        - 文档与教程
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: 内容简介
      description: 说明解决的问题、支持范围和当前成熟度。
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: 验证方式与已知限制
      description: 区分模拟测试和真实页面验证，并说明仍需人工处理的部分。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 分享内容已经脱敏，不含账号、凭据、二维码、店铺或客户身份信息。
          required: true
