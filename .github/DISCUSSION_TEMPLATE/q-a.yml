title: "[使用求助] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        请勿上传账号、Cookie、token、二维码、店铺编号、真实订单或完整 data 目录。
  - type: input
    id: app
    attributes:
      label: App 与版本
      description: 例如“拼多多女装 T 恤上新助手 v0.1.0”
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 系统与浏览器
      description: 例如“Windows 11 25H2，Microsoft Edge”
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 想完成什么
      description: 说明操作目标，以及进行到了哪一步。
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: 当前现象
      description: 粘贴完整错误文字或提供已脱敏截图，并说明已经尝试过什么。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除账号、Cookie、token、二维码、店铺及客户身份信息。
          required: true
