name: Adapter 页面变化或故障
description: 报告已登记 Adapter 的填写、回读或恢复问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "请先移除账号、Cookie、token、二维码、店铺编号和真实商品资料。"
  - type: input
    id: adapter
    attributes:
      label: Adapter ID 与版本
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 系统与浏览器版本
    validations:
      required: true
  - type: textarea
    id: trigger
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 实际结果与预期结果
    validations:
      required: true
  - type: dropdown
    id: side_effect
    attributes:
      label: 是否可能已写入平台
      options: ["没有写入", "可能已填写页面", "可能已上传图片", "可能已保存草稿", "结果不确定"]
    validations:
      required: true
