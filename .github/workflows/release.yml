name: Build portable releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npx playwright install --with-deps chromium
      - if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/release-version-check.mjs "${GITHUB_REF_NAME}"
      - run: npm run test:ci

  windows-packages:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        app: [pdd-womenswear-tshirt, pdd-board-shoes]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: node scripts/build-windows-portable.mjs "${{ matrix.app }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-windows-x64
          path: |
            release/${{ matrix.app }}-*-windows-x64.zip
            release/${{ matrix.app }}-*-windows-x64.zip.sha256
          if-no-files-found: error

  macos-packages:
    needs: verify
    runs-on: macos-14
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        app: [pdd-womenswear-tshirt, pdd-board-shoes]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: node scripts/build-macos-portable.mjs "${{ matrix.app }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-macos-universal
          path: |
            release/${{ matrix.app }}-*-macos-universal.zip
            release/${{ matrix.app }}-*-macos-universal.zip.sha256
          if-no-files-found: error

  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows-packages, macos-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "pdd-*"
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/* --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
